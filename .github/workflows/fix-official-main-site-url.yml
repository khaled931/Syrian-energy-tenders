name: One-time official main-site URL migration

on:
  push:
    branches: [fix/official-main-site-url]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Replace obsolete main-site domain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={"https://syrian-renewables-web.vercel.app":"https://www.syrian-renewables.com","http://syrian-renewables-web.vercel.app":"https://www.syrian-renewables.com",r"https:\/\/syrian-renewables-web.vercel.app":r"https:\/\/www.syrian-renewables.com",r"http:\/\/syrian-renewables-web.vercel.app":r"https:\/\/www.syrian-renewables.com"}
          skip={'.git','node_modules','.next','dist','build','coverage'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(x in skip for x in p.parts): continue
              try:
                  b=p.read_bytes()
                  if b'\x00' in b: continue
                  s=b.decode('utf-8')
              except (UnicodeDecodeError,OSError): continue
              u=s
              for old,new in replacements.items(): u=u.replace(old,new)
              if u!=s: p.write_text(u,encoding='utf-8',newline=''); print(p)
          PY
          rm -f .github/workflows/fix-official-main-site-url.yml
          ! git grep -n "syrian-renewables-web\.vercel\.app" -- . ':!.git'
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: use official Syrian Renewables domain"
          git push origin HEAD:fix/official-main-site-url
