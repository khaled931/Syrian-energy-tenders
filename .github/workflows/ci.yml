name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/unify-tenders-platform-ui

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PLATFORM_NAVIGATION_USE_SNAPSHOT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Security, persistence and deadline regression tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive browser checks
        run: npm run test:e2e

      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-ui-browser-checks
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7
